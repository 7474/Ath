name: Build Aarth Font & Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'generate_aarth_font.py'
      - 'Ath_alphabet.png'
      - 'templates/**'
      - 'LICENSE.md'
      - 'index.html'
      - 'site.css'
      - 'favicon.ico'
      - 'icons/**'
      - 'assets/favicon-source.jpg'
      - 'generate_favicon.py'
      - 'ath/**'
      - 'aarth.css'
      - 'faces.json'
      - 'ath-face.js'
      - 'theme.js'
      - 'requirements.txt'
      - 'web/**'
      - 'langs/**'
      - 'data/lexicon.json'
      - 'data/ingested.json'
      - 'baronh/**'
      - '.github/workflows/build-font.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y potrace

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate fonts
        run: |
          python3 generate_aarth_font.py \
            --all-faces \
            --output-dir docs \
            --debug

      - name: Copy site pages and export vector index
        run: |
          cp index.html docs/index.html
          cp site.css docs/site.css
          cp aarth.css docs/aarth.css
          cp faces.json docs/faces.json
          cp ath-face.js docs/ath-face.js
          cp theme.js docs/theme.js
          cp favicon.ico docs/favicon.ico
          rm -rf docs/icons
          cp -r icons docs/icons
          rm -rf docs/ath docs/web
          mkdir -p docs/ath docs/web/data docs/data
          cp ath/index.html docs/ath/index.html
          cp -r web/css web/js web/index.html docs/web/
          cp -f web/aarth.woff2 web/aarth.ttf docs/web/
          python3 -m baronh export-web --out docs/web/data
          cp docs/web/data/lexicon.json docs/data/lexicon.json
          cp docs/web/data/vectors.json docs/data/vectors.json
          cp docs/web/data/vectors.bin docs/data/vectors.bin
          test -s docs/web/data/vectors.bin
          test -s docs/web/data/vectors.json
          touch docs/.nojekyll

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "ci: regenerate aarth font [skip ci]"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # pick up the just-committed docs/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
